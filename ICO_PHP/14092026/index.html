	<body>
			<h1>Agregar Usuario</h1>
			<fieldset>
			<form action="Controlador/insertar.php" method="post">

				<input type="text" name="nombre" value="" maxlength="150" placeholder="Santiago CG" required>

				<label for="email">Email:</label>

				<br><br>
				<label for="telefono">Telefono</label>
				<input type="number" name="telefono" value="" maxlength="15" placeholder="561342626666" required>

				<button type="submit">Registrar</button>
			</form>
			</fieldset>
